name: Demo integral com navegador e video real

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/e2e-demo-video-20261110]
    paths:
      - '.github/workflows/e2e.yml'
      - 'scripts/demo_e2e.mjs'
      - 'src/**'

jobs:
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar a API de ML com dados oficiais
        run: |
          git clone --depth 1 https://github.com/vicenteosorioneto/iranian-churn-backend.git ../iranian-churn-backend
          cd ../iranian-churn-backend
          python -m pip install -r requirements.txt
          curl --fail --location --retry 3 --output data/raw/iranian_churn.csv https://archive.ics.uci.edu/static/public/563/data.csv
          python -m app.ml.train
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/churn_backend.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/models/metrics >/dev/null
      - name: Preparar frontend e navegador
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          echo 'NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api' > .env.local
          npm run dev >/tmp/churn_frontend.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/dashboard >/dev/null && break || sleep 2; done
      - name: Executar demo real e gravar video
        env:
          DEMO_FRONTEND_URL: http://127.0.0.1:3000
        run: |
          curl -fsS http://127.0.0.1:8000/api/analytics/summary | head -c 600
          node scripts/demo_e2e.mjs
      - name: Diagnostico dos servidores
        if: always()
        run: |
          tail -n 70 /tmp/churn_backend.log || true
          tail -n 70 /tmp/churn_frontend.log || true
      - name: Evidencias e video da demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-churn-real
          path: |
            artifacts/
            /tmp/churn_backend.log
            /tmp/churn_frontend.log
          if-no-files-found: warn
          retention-days: 14
